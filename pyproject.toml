[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "qaoa-hybrid-routing"
version = "2.0.1"
description = "QAOA-aware routing for Qiskit, backed by Rust"
authors = [{name = "Deni Aldamov"}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["qiskit>=2.5.2,<3"]

[project.urls]
Source = "https://github.com/radiumQCO/QAOA-Hybrid-Routing"
Results = "https://github.com/radiumQCO/QAOA-Hybrid-Routing/blob/main/results/v2_64q_research_report_20260928.md"

[project.entry-points."qiskit.transpiler.routing"]
qaoa_hybrid = "qaoa_hybrid.plugin:HybridRoutingPlugin"

[tool.maturin]
manifest-path = "rust_core/Cargo.toml"
python-source = "."
python-packages = ["qaoa_hybrid"]
module-name = "qaoa_hybrid.qaoa_v2_rust"
bindings = "pyo3"
locked = true
include = [
  "LICENSE",
  "hybrid_level3.py",
  "hybrid_level3_v2.py",
  "hybrid_line_next.py",
  "layout_seed.py",
  "rust_router_core.py",
  "routing_metrics.py",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]
